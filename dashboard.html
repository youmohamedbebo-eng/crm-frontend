<script>

const API = "https://crm-backend-svnl.onrender.com";

let user = null;
let token = null;

try {
  user = JSON.parse(localStorage.getItem("user"));
  token = localStorage.getItem("token");
} catch (e) {}

if (!user || !token) {
  location.href = "index.html";
}

const usernameEl = document.getElementById("username");
if (usernameEl) {
  usernameEl.innerText = user?.name || "User";
}

function logout(){
  localStorage.clear();
  location.href = "index.html";
}

/* LOAD */
function loadLeads() {
  fetch(API + "/leads", {
    headers: { Authorization: token }
  })
  .then(r => r.json())
  .then(data => {

    if (!Array.isArray(data)) {
      console.log("API error:", data);
      return;
    }

    ["New","Contacted","Interested","Not Interested","Closed Won"].forEach(s=>{
      const el = document.getElementById(s);
      if (el) el.innerHTML = "";
    });

    const total = document.getElementById("total");
    const interested = document.getElementById("interested");
    const closed = document.getElementById("closed");
    const newC = document.getElementById("new");

    if (total) total.innerText = data.length;
    if (interested) interested.innerText = data.filter(l=>l.status==="Interested").length;
    if (closed) closed.innerText = data.filter(l=>l.status==="Closed Won").length;
    if (newC) newC.innerText = data.filter(l=>l.status==="New").length;

    data.forEach(l => {

      const div = document.createElement("div");
      div.className = "lead";

      div.innerHTML = `
        <b>${l.name || ""}</b><br>
        📞 ${l.phone || ""}<br><br>

        <select onchange="updateStatus('${l._id}',this.value)">
          <option ${l.status==="New"?"selected":""}>New</option>
          <option ${l.status==="Contacted"?"selected":""}>Contacted</option>
          <option ${l.status==="Interested"?"selected":""}>Interested</option>
          <option ${l.status==="Not Interested"?"selected":""}>Not Interested</option>
          <option ${l.status==="Closed Won"?"selected":""}>Closed Won</option>
        </select>
      `;

      const col = document.getElementById(l.status);
      if(col) col.appendChild(div);

    });

  })
  .catch(err => {
    console.log("Fetch error:", err);
  });
}

/* ADD */
function addLead(){
  const nameInput = document.getElementById("name");
  const phoneInput = document.getElementById("phone");

  if(!nameInput || !phoneInput) return;

  if(!nameInput.value || !phoneInput.value){
    alert("Please enter name and phone");
    return;
  }

  fetch(API+"/leads",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:token
    },
    body:JSON.stringify({
      name: nameInput.value,
      phone: phoneInput.value
    })
  })
  .then(r => r.json())
  .then(() => {
    nameInput.value = "";
    phoneInput.value = "";
    loadLeads();
  })
  .catch(err => console.log(err));
}

/* UPDATE */
function updateStatus(id,status){
  fetch(API+"/leads/"+id,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      Authorization:token
    },
    body:JSON.stringify({status})
  })
  .then(loadLeads)
  .catch(err => console.log(err));
}

loadLeads();

</script>
