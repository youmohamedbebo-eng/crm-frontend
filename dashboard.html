<!DOCTYPE html>
<html>
<head>
  <title>CRM SaaS Dashboard</title>
</head>
<body>

<script>
let user = JSON.parse(localStorage.getItem("user"));
let token = localStorage.getItem("token");

if (!user || !token) {
  window.location.href = "index.html";
}
</script>

<h1>🚀 CRM SaaS Pipeline</h1>

<!-- 🟢 STATS -->
<div style="display:flex; gap:15px; margin-bottom:20px;">
  <div id="total">Total: 0</div>
  <div id="new">New: 0</div>
  <div id="hot">Interested: 0</div>
  <div id="won">Closed: 0</div>
</div>

<hr>

<!-- 🟢 ADD LEAD -->
<h2>➕ Add Lead</h2>

<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>

<button onclick="addLead()">Add Lead</button>

<p id="msg"></p>

<hr>

<!-- 🟢 PIPELINE (KANBAN) -->
<div style="display:flex; gap:10px; align-items:flex-start;">

  <div style="flex:1">
    <h3>🆕 New</h3>
    <div id="New"></div>
  </div>

  <div style="flex:1">
    <h3>📞 Contacted</h3>
    <div id="Contacted"></div>
  </div>

  <div style="flex:1">
    <h3>🔥 Interested</h3>
    <div id="Interested"></div>
  </div>

  <div style="flex:1">
    <h3>❌ Not Interested</h3>
    <div id="Not Interested"></div>
  </div>

  <div style="flex:1">
    <h3>🏆 Closed Won</h3>
    <div id="Closed Won"></div>
  </div>

</div>

<script>

/* =======================
   LOAD LEADS
======================= */
function loadLeads() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    headers: { "Authorization": token }
  })
  .then(res => res.json())
  .then(data => {

    // 🟢 RESET COLUMNS
    ["New","Contacted","Interested","Not Interested","Closed Won"].forEach(s => {
      document.getElementById(s).innerHTML = "";
    });

    // 🟢 STATS
    document.getElementById("total").innerText = "Total: " + data.length;
    document.getElementById("new").innerText = "New: " + data.filter(l => l.status === "New").length;
    document.getElementById("hot").innerText = "Interested: " + data.filter(l => l.status === "Interested").length;
    document.getElementById("won").innerText = "Closed: " + data.filter(l => l.status === "Closed Won").length;

    data.forEach(l => {

      const card = `
        <div style="
          background:#f5f5f5;
          padding:10px;
          margin:5px;
          border-radius:8px;
          font-size:14px;
        ">
          <b>${l.name}</b><br>
          📞 ${l.phone}<br><br>

          <select onchange="updateStatus('${l._id}', this.value)">
            <option ${l.status==="New"?"selected":""}>New</option>
            <option ${l.status==="Contacted"?"selected":""}>Contacted</option>
            <option ${l.status==="Interested"?"selected":""}>Interested</option>
            <option ${l.status==="Not Interested"?"selected":""}>Not Interested</option>
            <option ${l.status==="Closed Won"?"selected":""}>Closed Won</option>
          </select>

          <br><br>

          <input id="note-${l._id}" placeholder="Add note">
          <button onclick="addNote('${l._id}')">💾</button>

          <div style="font-size:12px; margin-top:5px;">
            ${l.notes?.map(n => "📝 " + n.text).join("<br>") || ""}
          </div>

          <br>
          <button onclick="deleteLead('${l._id}')">❌ Delete</button>
        </div>
      `;

      if (document.getElementById(l.status)) {
        document.getElementById(l.status).innerHTML += card;
      }

    });

  });
}

/* =======================
   ADD LEAD
======================= */
function addLead() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      name: name.value,
      phone: phone.value,
      status: "New"
    })
  }).then(() => {
    msg.innerText = "✔ Added";
    loadLeads();
  });
}

/* =======================
   UPDATE STATUS
======================= */
function updateStatus(id, status) {
  fetch("https://crm-backend-svnl.onrender.com/leads/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({ status })
  }).then(loadLeads);
}

/* =======================
   DELETE
======================= */
function deleteLead(id) {
  fetch("https://crm-backend-svnl.onrender.com/leads/" + id, {
    method: "DELETE",
    headers: { "Authorization": token }
  }).then(loadLeads);
}

/* =======================
   ADD NOTE
======================= */
function addNote(id) {
  let text = document.getElementById("note-" + id).value;

  fetch("https://crm-backend-svnl.onrender.com/leads/" + id + "/note", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({ text })
  }).then(loadLeads);
}

</script>

</body>
</html>
