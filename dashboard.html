<!DOCTYPE html>
<html>
<head>
  <title>CRM Dashboard</title>
</head>
<body>

<script>
let user = JSON.parse(localStorage.getItem("user"));
let token = localStorage.getItem("token");

if (!user || !token) {
  window.location.href = "index.html";
}
</script>

<h1>CRM Leads 🚀</h1>

<!-- 🟢 Add Lead -->
<h2>Add Lead ➕</h2>

<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>

<button onclick="addLead()">Add Lead</button>

<p id="msg"></p>

<hr>

<!-- 🟢 Load Leads -->
<button onclick="loadLeads()">Load Leads</button>

<table border="1">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="data"></tbody>
</table>

<script>

/* =======================
   LOAD LEADS
======================= */
function loadLeads() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    method: "GET",
    headers: {
      "Authorization": token
    }
  })
  .then(res => {
    if (res.status === 401) throw new Error("Unauthorized");
    return res.json();
  })
  .then(data => {

    let rows = "";

    data.forEach(l => {
      rows += `
        <tr>
          <td>${l.name || "-"}</td>
          <td>${l.phone || "-"}</td>

          <!-- 🟢 STATUS DROPDOWN -->
          <td>
            <select onchange="updateStatus('${l._id}', this.value)">
              <option value="New" ${l.status === "New" ? "selected" : ""}>New</option>
              <option value="Contacted" ${l.status === "Contacted" ? "selected" : ""}>Contacted</option>
              <option value="Interested" ${l.status === "Interested" ? "selected" : ""}>Interested</option>
              <option value="Not Interested" ${l.status === "Not Interested" ? "selected" : ""}>Not Interested</option>
              <option value="Follow Up" ${l.status === "Follow Up" ? "selected" : ""}>Follow Up</option>
              <option value="Closed Won" ${l.status === "Closed Won" ? "selected" : ""}>Closed Won</option>
            </select>
          </td>

          <td>
            <button onclick="deleteLead('${l._id}')">❌ Delete</button>
          </td>
        </tr>
      `;
    });

    document.getElementById("data").innerHTML = rows;
  })
  .catch(() => {
    alert("Session expired, please login again");
    localStorage.clear();
    window.location.href = "index.html";
  });
}

/* =======================
   ADD LEAD
======================= */
function addLead() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      status: "New"
    })
  })
  .then(() => {
    document.getElementById("msg").innerText = "✔ Lead Added Successfully";

    name.value = "";
    phone.value = "";

    loadLeads();
  });
}

/* =======================
   DELETE LEAD
======================= */
function deleteLead(id) {
  fetch("https://crm-backend-svnl.onrender.com/leads/" + id, {
    method: "DELETE",
    headers: {
      "Authorization": token
    }
  }).then(loadLeads);
}

/* =======================
   UPDATE STATUS
======================= */
function updateStatus(id, status) {
  fetch("https://crm-backend-svnl.onrender.com/leads/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({ status })
  }).then(loadLeads);
}

</script>

</body>
</html>
