<!DOCTYPE html>
<html>
<head>
  <title>Y1CRM Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; font-family: Inter; }

    body {
      margin: 0;
      display: flex;
      height: 100vh;
      background: #f4f6fb;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .logo {
      font-weight: 700;
      margin-bottom: 20px;
    }

    .menu div {
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      cursor: pointer;
    }

    .menu div:hover {
      background: rgba(255,255,255,0.1);
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 20px;
      overflow: auto;
    }

    .section { display: none; }
    .active { display: block; }

    /* CARDS */
    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
    }

    /* PIPELINE */
    .board {
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .col {
      min-width: 250px;
      background: white;
      border-radius: 10px;
      padding: 10px;
      height: 60vh;
      overflow-y: auto;
    }

    .lead {
      background: #f1f5f9;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">🚀 Y1CRM</div>

  <div class="menu">
    <div onclick="show('dashboard')">📊 Dashboard</div>
    <div onclick="show('leads')">📁 Leads</div>
    <div onclick="show('analytics')">📈 Analytics</div>
    <div onclick="show('settings')">⚙️ Settings</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- DASHBOARD -->
  <div id="dashboard" class="section active">

    <h2>Pipeline</h2>

    <div class="stats">
      <div class="card">Total <div id="total">0</div></div>
      <div class="card">Interested <div id="hot">0</div></div>
      <div class="card">Closed <div id="closed">0</div></div>
      <div class="card">New <div id="new">0</div></div>
    </div>

    <div class="board">
      <div class="col"><h4>New</h4><div id="New"></div></div>
      <div class="col"><h4>Contacted</h4><div id="Contacted"></div></div>
      <div class="col"><h4>Interested</h4><div id="Interested"></div></div>
      <div class="col"><h4>Not Interested</h4><div id="Not Interested"></div></div>
      <div class="col"><h4>Closed Won</h4><div id="Closed Won"></div></div>
    </div>

  </div>

  <!-- LEADS -->
  <div id="leads" class="section">
    <h2>Leads List</h2>
    <div id="leadsList"></div>
  </div>

  <!-- ANALYTICS -->
  <div id="analytics" class="section">
    <h2>Analytics 📊</h2>
    <p>Total Leads: <span id="a_total">0</span></p>
    <p>Hot Leads: <span id="a_hot">0</span></p>
    <p>Closed Leads: <span id="a_closed">0</span></p>
  </div>

  <!-- SETTINGS -->
  <div id="settings" class="section">
    <h2>Settings ⚙️</h2>
    <p>User: <span id="user"></span></p>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<script>

const API = "https://crm-backend-svnl.onrender.com";

let user = JSON.parse(localStorage.getItem("user"));
let token = localStorage.getItem("token");

if(!user || !token) location.href = "index.html";

document.getElementById("user").innerText = user.email;

/* NAV */
function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.href = "index.html";
}

/* LOAD LEADS */
function loadLeads(){
  fetch(API+"/leads",{
    headers:{Authorization:token}
  })
  .then(r=>r.json())
  .then(data=>{

    // stats
    document.getElementById("total").innerText = data.length;
    document.getElementById("hot").innerText = data.filter(l=>l.status==="Interested").length;
    document.getElementById("closed").innerText = data.filter(l=>l.status==="Closed Won").length;
    document.getElementById("new").innerText = data.filter(l=>l.status==="New").length;

    // analytics
    document.getElementById("a_total").innerText = data.length;
    document.getElementById("a_hot").innerText = data.filter(l=>l.status==="Interested").length;
    document.getElementById("a_closed").innerText = data.filter(l=>l.status==="Closed Won").length;

    // pipeline
    ["New","Contacted","Interested","Not Interested","Closed Won"].forEach(s=>{
      document.getElementById(s).innerHTML="";
    });

    data.forEach(l=>{
      let div = document.createElement("div");
      div.className = "lead";
      div.innerHTML = `<b>${l.name}</b><br>${l.phone}`;
      document.getElementById(l.status)?.appendChild(div);
    });

    // leads page
    document.getElementById("leadsList").innerHTML =
      data.map(l=>`<div class="lead">${l.name} - ${l.phone}</div>`).join("");

  });
}

loadLeads();

</script>

</body>
</html>
