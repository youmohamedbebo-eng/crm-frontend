<!DOCTYPE html>
<html>
<head>
  <title>CRM SaaS Dashboard</title>

  <style>
    .column{
      flex:1;
      min-height:400px;
      background:#f7f7f7;
      padding:10px;
      border-radius:10px;
    }

    .card{
      background:#fff;
      padding:10px;
      margin:8px;
      border-radius:8px;
      cursor:grab;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
      font-size:14px;
    }
  </style>
</head>
<body>

<script>
let user = JSON.parse(localStorage.getItem("user"));
let token = localStorage.getItem("token");

if (!user || !token) {
  window.location.href = "index.html";
}
</script>

<h1>🚀 CRM SaaS Pipeline</h1>

<!-- 🟢 STATS -->
<div style="display:flex; gap:15px; margin-bottom:20px;">
  <div id="total">Total: 0</div>
  <div id="new">New: 0</div>
  <div id="hot">Interested: 0</div>
  <div id="won">Closed: 0</div>
</div>

<hr>

<!-- 🟢 ADD LEAD -->
<h2>➕ Add Lead</h2>

<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>

<button onclick="addLead()">Add Lead</button>

<p id="msg"></p>

<hr>

<!-- 🟢 KANBAN -->
<div style="display:flex; gap:10px;">

  <div class="column" ondrop="drop(event,'New')" ondragover="allowDrop(event)">
    <h3>🆕 New</h3>
    <div id="New"></div>
  </div>

  <div class="column" ondrop="drop(event,'Contacted')" ondragover="allowDrop(event)">
    <h3>📞 Contacted</h3>
    <div id="Contacted"></div>
  </div>

  <div class="column" ondrop="drop(event,'Interested')" ondragover="allowDrop(event)">
    <h3>🔥 Interested</h3>
    <div id="Interested"></div>
  </div>

  <div class="column" ondrop="drop(event,'Not Interested')" ondragover="allowDrop(event)">
    <h3>❌ Not Interested</h3>
    <div id="Not Interested"></div>
  </div>

  <div class="column" ondrop="drop(event,'Closed Won')" ondragover="allowDrop(event)">
    <h3>🏆 Closed Won</h3>
    <div id="Closed Won"></div>
  </div>

</div>

<script>

/* =======================
   LOAD LEADS
======================= */
function loadLeads() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    headers: { "Authorization": token }
  })
  .then(res => res.json())
  .then(data => {

    // reset
    ["New","Contacted","Interested","Not Interested","Closed Won"].forEach(s=>{
      document.getElementById(s).innerHTML = "";
    });

    // stats
    document.getElementById("total").innerText = "Total: " + data.length;
    document.getElementById("new").innerText = "New: " + data.filter(l=>l.status==="New").length;
    document.getElementById("hot").innerText = "Interested: " + data.filter(l=>l.status==="Interested").length;
    document.getElementById("won").innerText = "Closed: " + data.filter(l=>l.status==="Closed Won").length;

    data.forEach(l => {

      const card = `
        <div class="card"
          draggable="true"
          ondragstart="drag(event)"
          data-id="${l._id}">

          <b>${l.name}</b><br>
          📞 ${l.phone}<br><br>

          <input id="note-${l._id}" placeholder="Add note">
          <button onclick="addNote('${l._id}')">💾</button>

          <div style="font-size:12px;margin-top:5px;">
            ${l.notes?.map(n=>"📝 "+n.text).join("<br>") || ""}
          </div>

          <br>
          <button onclick="deleteLead('${l._id}')">❌ Delete</button>
        </div>
      `;

      if(document.getElementById(l.status)){
        document.getElementById(l.status).innerHTML += card;
      }

    });

  });
}

/* =======================
   ADD LEAD
======================= */
function addLead() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({
      name:name.value,
      phone:phone.value,
      status:"New"
    })
  }).then(()=>{ msg.innerText="✔ Added"; loadLeads(); });
}

/* =======================
   DRAG & DROP
======================= */
function drag(ev){
  ev.dataTransfer.setData("id", ev.target.dataset.id);
}

function allowDrop(ev){
  ev.preventDefault();
}

function drop(ev,status){
  ev.preventDefault();
  let id = ev.dataTransfer.getData("id");

  fetch("https://crm-backend-svnl.onrender.com/leads/"+id,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({status})
  }).then(loadLeads);
}

/* =======================
   DELETE
======================= */
function deleteLead(id){
  fetch("https://crm-backend-svnl.onrender.com/leads/"+id,{
    method:"DELETE",
    headers:{ "Authorization":token }
  }).then(loadLeads);
}

/* =======================
   ADD NOTE
======================= */
function addNote(id){
  let text=document.getElementById("note-"+id).value;

  fetch("https://crm-backend-svnl.onrender.com/leads/"+id+"/note",{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({text})
  }).then(loadLeads);
}

</script>

</body>
</html>
