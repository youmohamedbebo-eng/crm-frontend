<!DOCTYPE html>
<html>
<head>
  <title>CRM Dashboard</title>
</head>
<body>

<script>
let user = JSON.parse(localStorage.getItem("user"));
let token = localStorage.getItem("token");

if (!user || !token) {
  window.location.href = "index.html";
}
</script>

<h1>CRM Leads 🚀</h1>

<!-- 🟢 STATS -->
<div style="display:flex; gap:10px; margin-bottom:15px;">
  <div id="total">Total: 0</div>
  <div id="new">New: 0</div>
  <div id="interested">Interested: 0</div>
  <div id="done">Closed: 0</div>
</div>

<hr>

<!-- 🟢 ADD LEAD -->
<h2>Add Lead ➕</h2>

<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>

<button onclick="addLead()">Add Lead</button>

<p id="msg"></p>

<hr>

<!-- 🟢 LOAD -->
<button onclick="loadLeads()">Load Leads</button>

<table border="1">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Status</th>
      <th>Notes</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="data"></tbody>
</table>

<script>

/* =======================
   LOAD LEADS
======================= */
function loadLeads() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    headers: { "Authorization": token }
  })
  .then(res => res.json())
  .then(data => {

    // 🔥 STATS
    document.getElementById("total").innerText = "Total: " + data.length;
    document.getElementById("new").innerText = "New: " + data.filter(l => l.status === "New").length;
    document.getElementById("interested").innerText = "Interested: " + data.filter(l => l.status === "Interested").length;
    document.getElementById("done").innerText = "Closed: " + data.filter(l => l.status === "Closed Won").length;

    let rows = "";

    data.forEach(l => {
      rows += `
        <tr>
          <td>${l.name || "-"}</td>
          <td>${l.phone || "-"}</td>

          <!-- STATUS -->
          <td>
            <select onchange="updateStatus('${l._id}', this.value)">
              <option value="New" ${l.status === "New" ? "selected" : ""}>New</option>
              <option value="Contacted" ${l.status === "Contacted" ? "selected" : ""}>Contacted</option>
              <option value="Interested" ${l.status === "Interested" ? "selected" : ""}>Interested</option>
              <option value="Not Interested" ${l.status === "Not Interested" ? "selected" : ""}>Not Interested</option>
              <option value="Follow Up" ${l.status === "Follow Up" ? "selected" : ""}>Follow Up</option>
              <option value="Closed Won" ${l.status === "Closed Won" ? "selected" : ""}>Closed Won</option>
            </select>
          </td>

          <!-- 🟢 NOTES -->
          <td>
            <input id="note-${l._id}" placeholder="Add note">
            <button onclick="addNote('${l._id}')">Save</button>

            <div style="font-size:12px; margin-top:5px;">
              ${l.notes?.map(n => "📝 " + n.text).join("<br>") || ""}
            </div>
          </td>

          <!-- ACTIONS -->
          <td>
            <button onclick="deleteLead('${l._id}')">❌</button>
          </td>
        </tr>
      `;
    });

    document.getElementById("data").innerHTML = rows;
  });
}

/* =======================
   ADD LEAD
======================= */
function addLead() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      name: name.value,
      phone: phone.value,
      status: "New"
    })
  })
  .then(() => {
    msg.innerText = "✔ Added";
    loadLeads();
  });
}

/* =======================
   DELETE
======================= */
function deleteLead(id) {
  fetch("https://crm-backend-svnl.onrender.com/leads/" + id, {
    method: "DELETE",
    headers: { "Authorization": token }
  }).then(loadLeads);
}

/* =======================
   UPDATE STATUS
======================= */
function updateStatus(id, status) {
  fetch("https://crm-backend-svnl.onrender.com/leads/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({ status })
  }).then(loadLeads);
}

/* =======================
   ADD NOTE
======================= */
function addNote(id) {
  let text = document.getElementById("note-" + id).value;

  fetch("https://crm-backend-svnl.onrender.com/leads/" + id + "/note", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({ text })
  }).then(loadLeads);
}

</script>

</body>
</html>
