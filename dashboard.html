<!DOCTYPE html>
<html>
<head>
  <title>CRM SaaS Pro</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6f9;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px;
      font-size: 18px;
    }

    .stats {
      display: flex;
      gap: 10px;
      padding: 15px;
    }

    .card {
      flex: 1;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .board {
      display: flex;
      gap: 10px;
      padding: 15px;
      overflow-x: auto;
    }

    .column {
      min-width: 250px;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      height: 70vh;
      overflow-y: auto;
    }

    .lead {
      background: #f9fafb;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      border-left: 4px solid #3b82f6;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 5px;
    }

    select, input {
      width: 100%;
      padding: 5px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<header>🚀 CRM SaaS Pro Max</header>

<!-- STATS -->
<div class="stats">
  <div class="card">Total <div id="total">0</div></div>
  <div class="card">Interested <div id="interested">0</div></div>
  <div class="card">Closed <div id="closed">0</div></div>
</div>

<!-- ADD LEAD -->
<div style="padding:15px;">
  <h3>Add Lead ➕</h3>
  <input id="name" placeholder="Name">
  <input id="phone" placeholder="Phone">
  <button onclick="addLead()">Add</button>
</div>

<!-- PIPELINE -->
<div class="board">

  <div class="column"><h3>New</h3><div id="New"></div></div>
  <div class="column"><h3>Contacted</h3><div id="Contacted"></div></div>
  <div class="column"><h3>Interested</h3><div id="Interested"></div></div>
  <div class="column"><h3>Not Interested</h3><div id="Not Interested"></div></div>
  <div class="column"><h3>Closed Won</h3><div id="Closed Won"></div></div>

</div>

<script>

const API = "https://crm-backend-svnl.onrender.com";

let user = JSON.parse(localStorage.getItem("user"));
let token = localStorage.getItem("token");

if (!user || !token) {
  window.location.href = "index.html";
}

/* ================= LOAD LEADS ================= */
function loadLeads() {
  fetch(API + "/leads", {
    headers: { Authorization: token }
  })
  .then(res => res.json())
  .then(data => {

    // reset columns safely
    ["New","Contacted","Interested","Not Interested","Closed Won"].forEach(s => {
      const el = document.getElementById(s);
      if (el) el.innerHTML = "";
    });

    // stats
    document.getElementById("total").innerText = data.length;
    document.getElementById("interested").innerText =
      data.filter(l => l.status === "Interested").length;

    document.getElementById("closed").innerText =
      data.filter(l => l.status === "Closed Won").length;

    data.forEach(l => {

      const status = l.status || "New";
      const col = document.getElementById(status);

      if (!col) return;

      const el = document.createElement("div");
      el.className = "lead";

      el.innerHTML = `
        <b>${l.name || "-"}</b><br>
        📞 ${l.phone || "-"}<br>

        <select onchange="updateStatus('${l._id}', this.value)">
          <option ${status==="New"?"selected":""}>New</option>
          <option ${status==="Contacted"?"selected":""}>Contacted</option>
          <option ${status==="Interested"?"selected":""}>Interested</option>
          <option ${status==="Not Interested"?"selected":""}>Not Interested</option>
          <option ${status==="Closed Won"?"selected":""}>Closed Won</option>
        </select>

        <input id="note-${l._id}" placeholder="Add note">
        <button onclick="addNote('${l._id}')">Save Note</button>

        <div style="font-size:12px">
          ${(l.notes || []).map(n => "📝 " + n.text).join("<br>")}
        </div>
      `;

      col.appendChild(el);
    });

  });
}

/* ================= ADD LEAD ================= */
function addLead() {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  if (!name || !phone) return;

  fetch(API + "/leads", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: token
    },
    body: JSON.stringify({ name, phone })
  })
  .then(() => {
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    loadLeads();
  });
}

/* ================= STATUS ================= */
function updateStatus(id, status) {
  fetch(API + "/leads/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      Authorization: token
    },
    body: JSON.stringify({ status })
  }).then(loadLeads);
}

/* ================= NOTE ================= */
function addNote(id) {
  const input = document.getElementById("note-" + id);

  if (!input.value) return;

  fetch(API + "/leads/" + id + "/note", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      Authorization: token
    },
    body: JSON.stringify({ text: input.value })
  }).then(() => {
    input.value = "";
    loadLeads();
  });
}

window.onload = loadLeads;

</script>

</body>
</html>
