<script>

const API = "https://crm-backend-svnl.onrender.com";

let user = JSON.parse(localStorage.getItem("user"));
let token = localStorage.getItem("token");

if (!user || !token) location.href = "index.html";

document.getElementById("username").innerText = user.name || "User";

function logout(){
  localStorage.clear();
  location.href = "index.html";
}

/* LOAD */
function loadLeads() {
  fetch(API + "/leads", {
    headers: { Authorization: token }
  })
  .then(r => r.json())
  .then(data => {

    ["New","Contacted","Interested","Not Interested","Closed Won"].forEach(s=>{
      document.getElementById(s).innerHTML = "";
    });

    document.getElementById("total").innerText = data.length;
    document.getElementById("interested").innerText = data.filter(l=>l.status==="Interested").length;
    document.getElementById("closed").innerText = data.filter(l=>l.status==="Closed Won").length;
    document.getElementById("new").innerText = data.filter(l=>l.status==="New").length;

    data.forEach(l => {

      const div = document.createElement("div");
      div.className = "lead";

      div.innerHTML = `
        <b>${l.name}</b><br>
        📞 ${l.phone}<br><br>

        <select onchange="updateStatus('${l._id}',this.value)">
          <option ${l.status==="New"?"selected":""}>New</option>
          <option ${l.status==="Contacted"?"selected":""}>Contacted</option>
          <option ${l.status==="Interested"?"selected":""}>Interested</option>
          <option ${l.status==="Not Interested"?"selected":""}>Not Interested</option>
          <option ${l.status==="Closed Won"?"selected":""}>Closed Won</option>
        </select>
      `;

      const col = document.getElementById(l.status);
      if(col) col.appendChild(div);

    });

  });
}

/* ADD (FIXED 🔥) */
function addLead(){
  const nameInput = document.getElementById("name");
  const phoneInput = document.getElementById("phone");

  if(!nameInput.value || !phoneInput.value){
    alert("Please enter name and phone");
    return;
  }

  fetch(API+"/leads",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:token
    },
    body:JSON.stringify({
      name: nameInput.value,
      phone: phoneInput.value
    })
  })
  .then(res => res.json())
  .then(() => {
    nameInput.value = "";
    phoneInput.value = "";
    loadLeads();
  });
}

/* UPDATE */
function updateStatus(id,status){
  fetch(API+"/leads/"+id,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      Authorization:token
    },
    body:JSON.stringify({status})
  }).then(loadLeads);
}

loadLeads();

</script>
