<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<script>
let user = JSON.parse(localStorage.getItem("user"));
if (!user) window.location.href = "index.html";
</script>

<h1>CRM Leads 🚀</h1>

<!-- 🟢 Add Lead Form -->
<h2>Add Lead ➕</h2>

<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>

<button onclick="addLead()">Add Lead</button>

<p id="msg"></p>

<hr>

<!-- 🟢 Load Leads -->
<button onclick="loadLeads()">Load Leads</button>

<table border="1">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="data"></tbody>
</table>

<script>
/* =======================
   LOAD LEADS
======================= */
function loadLeads() {
  fetch("https://crm-backend-svnl.onrender.com/leads?user=" + user.email)
  .then(res => res.json())
  .then(data => {
    let rows = "";

    data.forEach(l => {
      rows += `
        <tr>
          <td>${l.name || "-"}</td>
          <td>${l.phone || "-"}</td>
          <td>${l.status || "-"}</td>
          <td><button onclick="deleteLead('${l._id}')">Delete ❌</button></td>
        </tr>
      `;
    });

    document.getElementById("data").innerHTML = rows;
  });
}

/* =======================
   ADD LEAD
======================= */
function addLead() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      status: "New",
      assignedTo: user.email
    })
  })
  .then(res => res.json())
  .then(() => {
    document.getElementById("msg").innerText = "✔ Lead Added Successfully";

    // refresh list automatically
    loadLeads();
  })
  .catch(() => {
    document.getElementById("msg").innerText = "❌ Error adding lead";
  });
}
</script>

</body>
</html>
