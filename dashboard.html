<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<script>
let user = JSON.parse(localStorage.getItem("user"));
let token = localStorage.getItem("token");

// لو مفيش login
if (!user || !token) window.location.href = "index.html";
</script>

<h1>CRM Leads 🚀</h1>

<!-- 🟢 Add Lead -->
<h2>Add Lead ➕</h2>

<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>

<button onclick="addLead()">Add Lead</button>

<p id="msg"></p>

<hr>

<!-- 🟢 Load Leads -->
<button onclick="loadLeads()">Load Leads</button>

<table border="1">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="data"></tbody>
</table>

<script>

/* =======================
   LOAD LEADS
======================= */
function loadLeads() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    headers: {
      "Authorization": token
    }
  })
  .then(res => {
    if (!res.ok) throw new Error("Unauthorized");
    return res.json();
  })
  .then(data => {
    let rows = "";

    data.forEach(l => {
      rows += `
        <tr>
          <td>${l.name || "-"}</td>
          <td>${l.phone || "-"}</td>
          <td>${l.status || "-"}</td>
          <td>
            <button onclick="deleteLead('${l._id}')">Delete ❌</button>
            <button onclick="markDone('${l._id}')">Done ✔</button>
          </td>
        </tr>
      `;
    });

    document.getElementById("data").innerHTML = rows;
  })
  .catch(() => {
    alert("Session expired, please login again");
    window.location.href = "index.html";
  });
}

/* =======================
   ADD LEAD
======================= */
function addLead() {
  fetch("https://crm-backend-svnl.onrender.com/leads", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      status: "New"
    })
  })
  .then(res => res.json())
  .then(() => {
    document.getElementById("msg").innerText = "✔ Lead Added Successfully";
    loadLeads();
  })
  .catch(() => {
    document.getElementById("msg").innerText = "❌ Error adding lead";
  });
}

/* =======================
   DELETE LEAD
======================= */
function deleteLead(id) {
  fetch("https://crm-backend-svnl.onrender.com/leads/" + id, {
    method: "DELETE",
    headers: {
      "Authorization": token
    }
  })
  .then(() => loadLeads());
}

/* =======================
   MARK AS DONE
======================= */
function markDone(id) {
  fetch("https://crm-backend-svnl.onrender.com/leads/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      status: "Done"
    })
  })
  .then(() => loadLeads());
}

</script>

</body>
</html>
