<!DOCTYPE html>
<html>
<head>
  <title>Y1CRM Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
    }

    /* LEFT SIDE */
    .left {
      flex: 1;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
    }

    .left h1 {
      font-size: 42px;
      margin: 0;
    }

    .left p {
      margin-top: 15px;
      opacity: 0.8;
      line-height: 1.6;
    }

    .badge {
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      padding: 10px 15px;
      display: inline-block;
      border-radius: 10px;
      font-size: 13px;
    }

    /* RIGHT SIDE */
    .right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8fafc;
    }

    .card {
      width: 360px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 20px;
      color: #1e293b;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    #msg {
      font-size: 13px;
      color: red;
      margin-top: 10px;
    }

    .footer {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }

    @media(max-width: 900px){
      .left { display:none; }
      .right { flex: 1; }
    }

  </style>
</head>

<body>

<!-- LEFT -->
<div class="left">
  <h1>🚀 Y1CRM</h1>
  <p>
    Manage leads, sales pipeline, and close deals faster.<br>
    A lightweight SaaS CRM built for modern teams.
  </p>

  <div class="badge">⚡ Real-time CRM • SaaS Ready • Multi-user</div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="card">

    <div class="logo">Login to your account</div>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="btn" onclick="login()">Sign in</button>

    <div id="msg"></div>

    <div class="footer">
      Powered by Y1CRM SaaS Engine
    </div>

  </div>
</div>

<script>
const API = "https://crm-backend-svnl.onrender.com";

function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if (!email || !password) {
    msg.innerText = "Enter email & password";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Signing in...";

  fetch(API + "/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  })
  .then(async res => {
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    return data;
  })
  .then(data => {
    localStorage.setItem("user", JSON.stringify(data.user));
    localStorage.setItem("token", data.token);

    window.location.href = "dashboard.html";
  })
  .catch(err => {
    msg.innerText = "❌ " + err.message;
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerText = "Sign in";
  });
}
</script>

</body>
</html>
