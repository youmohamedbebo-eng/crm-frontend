<!DOCTYPE html>
<html>
<head>
  <title>Y1CRM Login</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #0f172a;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      margin-top: 10px;
      font-weight: bold;
    }

    button:hover {
      background: #2563eb;
    }

    button:disabled {
      background: #94a3b8;
    }

    #msg {
      margin-top: 12px;
      font-size: 13px;
      color: red;
    }

    .small {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">🚀 Y1CRM</div>

  <h3>Login</h3>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="btn" onclick="login()">Login</button>

  <p id="msg"></p>

  <div class="small">Secure SaaS CRM Platform</div>
</div>

<script>
const API = "https://crm-backend-svnl.onrender.com";

function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if (!email || !password) {
    msg.innerText = "⚠️ Please fill all fields";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Logging in...";

  fetch(API + "/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  })
  .then(async res => {
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "Login failed");
    return data;
  })
  .then(data => {
    localStorage.setItem("user", JSON.stringify(data.user));
    localStorage.setItem("token", data.token);

    window.location.href = "dashboard.html";
  })
  .catch(err => {
    msg.innerText = "❌ " + err.message;
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerText = "Login";
  });
}
</script>

</body>
</html>
