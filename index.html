<!DOCTYPE html>
<html>
<head>
  <title>CRM Login</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
    }

    button:disabled {
      background: #9ca3af;
    }

    #msg {
      margin-top: 10px;
      font-size: 14px;
      color: red;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>CRM Login 🔐</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="btn" onclick="login()">Login</button>

  <p id="msg"></p>
</div>

<script>
const API = "https://crm-backend-svnl.onrender.com";

function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if (!email || !password) {
    msg.innerText = "⚠️ Enter email & password";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Loading...";

  fetch(API + "/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ email, password })
  })
  .then(async res => {
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "Login failed");
    return data;
  })
  .then(data => {
    localStorage.setItem("user", JSON.stringify(data.user));
    localStorage.setItem("token", data.token);

    window.location.href = "dashboard.html";
  })
  .catch(err => {
    msg.innerText = "❌ " + err.message;
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerText = "Login";
  });
}
</script>

</body>
</html>
